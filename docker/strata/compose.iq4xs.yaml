services:
  strata:
    build:
      context: ../..
      dockerfile: docker/strata/Dockerfile
      args:
        STRATA_REPO: ${STRATA_REPO:-https://github.com/Niko1221/Strata.git}
        STRATA_COMMIT: ${STRATA_COMMIT:-a1641e9f77aacad4d201b53c8a7ae8fa21059ebb}
        CUDA_ARCHITECTURES: ${CUDA_ARCHITECTURES:-89}
    image: ${STRATA_IMAGE:-strata-qwen38:4090-iq4xs}
    env_file:
      # Requires the v0.1.39 image; never select it with the IQ3_S image.
      - ${STRATA_PROFILE:-../../configs/strata-qwen38-flash-next-4090-ud-iq4xs.env}
    environment:
      # Container listener; host binding is controlled by the published port.
      HOST: 0.0.0.0
      PORT: "8080"
      # No API key by default: publish only on VM205's NetBird address.
      # Optional authentication must be configured before first setup.
      API_KEY: ${STRATA_API_KEY:-}
    gpus: all
    ulimits:
      memlock: -1
    ports:
      - "${STRATA_BIND_ADDRESS:-100.0.0.159}:${STRATA_PORT:-8080}:8080"
    volumes:
      # Shared data, separate per-model setup configs; never run both services.
      - ${STRATA_DATA_DIR:-/opt/models}:/data
