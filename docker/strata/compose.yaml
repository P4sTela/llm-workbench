services:
  strata:
    build:
      context: ../..
      dockerfile: docker/strata/Dockerfile
      args:
        STRATA_REPO: ${STRATA_REPO:-https://github.com/Niko1221/Strata.git}
        STRATA_COMMIT: ${STRATA_COMMIT:-1678de333d0e0711bc414ad992b640e1a37dd814}
        CUDA_ARCHITECTURES: ${CUDA_ARCHITECTURES:-89}
    image: ${STRATA_IMAGE:-strata-qwen38:4090}
    env_file:
      # The single default main profile; STRATA_PROFILE can select an alternative.
      - ${STRATA_PROFILE:-../../configs/strata-qwen38-flash-next-4090.env}
    environment:
      # Container listener; host binding is controlled by the published port.
      HOST: 0.0.0.0
      PORT: "8080"
      # No API key by default: publish only on VM205's NetBird address.
      # Optional authentication must be configured before first setup.
      API_KEY: ${STRATA_API_KEY:-}
      # Extra Host names clients may use without an API key (comma-separated,
      # DNS-rebinding protection). IP addresses always work; restart to apply.
      STRATA_ALLOWED_HOSTS: ${STRATA_ALLOWED_HOSTS:-}
    gpus: all
    ulimits:
      memlock: -1
    ports:
      - "${STRATA_BIND_ADDRESS:-100.0.0.159}:${STRATA_PORT:-8080}:8080"
    volumes:
      # Model files, prepared pack, MTP layer and setup config stay outside Git.
      - ${STRATA_DATA_DIR:-/opt/models}:/data
