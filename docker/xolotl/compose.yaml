# Xolotl `xolotl-inkling` engine. Exclusive with the other GPU services.
services:
  xolotl:
    build:
      context: .
      args:
        XOLOTL_COMMIT: ${XOLOTL_COMMIT:-3435d55}
        CUDA_ARCH: ${CUDA_ARCH:-89}
    image: llm-workbench/xolotl:${XOLOTL_COMMIT:-3435d55}
    command: ["--config", "/config/xolotl.json", "--host", "0.0.0.0", "--port", "8134"]
    # Optional extra engine environment (e.g. GGML_CUDA_DISABLE_GRAPHS=1, XOLOTL_DSPARK_* knobs).
    env_file:
      - path: ${XOLOTL_ENV_FILE:-./xolotl.env}
        required: false
    environment:
      STRATA_API_KEY: ${STRATA_API_KEY:?set STRATA_API_KEY in .env}
    gpus: all
    ulimits:
      memlock: -1
    shm_size: 2g
    stop_grace_period: 2m
    ports:
      - "${XOLOTL_BIND_ADDRESS:-100.0.0.83}:${XOLOTL_PORT:-8081}:8134"
    volumes:
      - ${MODEL_DIR:-/opt/models}:/models:ro
      - ${XOLOTL_CONFIG:-../../configs/xolotl-inkling2mini-abliterated-4090.json}:/config/xolotl.json:ro
